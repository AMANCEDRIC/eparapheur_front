<div class="p-6">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Mon profil</h1>
    <p class="text-gray-600 mt-1">Informations de votre compte</p>
  </div>

  <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <!-- Header avec avatar -->
    <div class="bg-gray-50 px-6 py-8 border-b border-gray-200">
      <div class="flex items-center gap-6">
        <div *ngIf="currentUser?.avatar?.url" class="w-24 h-24 rounded-full overflow-hidden border-4 border-white shadow-lg">
          <img [src]="currentUser?.avatar?.url || ''" [alt]="getFullName()" class="w-full h-full object-cover">
        </div>
        <div *ngIf="!currentUser?.avatar?.url" class="w-24 h-24 rounded-full bg-primary text-white border-4 border-white shadow-lg flex items-center justify-center font-bold text-3xl">
          {{ getInitials() }}
        </div>
        <div>
          <h2 class="text-2xl font-bold text-gray-900">{{ getFullName() }}</h2>
          <p class="text-gray-600 mt-1">{{ getProfileName() }}</p>
        </div>
      </div>
    </div>

    <!-- Informations -->
    <div class="p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <div class="text-gray-900">{{ currentUser?.login || 'Non renseigné' }}</div>
        </div>

        <!-- Téléphone -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Téléphone</label>
          <div class="text-gray-900">{{ currentUser?.person?.phone || 'Non renseigné' }}</div>
        </div>

        <!-- Profil -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Profil</label>
          <div class="text-gray-900">{{ getProfileName() }}</div>
        </div>

        <!-- Statut -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Statut</label>
          <span [class]="'inline-flex items-center px-3 py-1 rounded-md text-sm font-medium ' + getStatusColor()">
            {{ getStatusLabel() }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
