<div class="space-y-6 app-fade-slide-in">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">{{ getListTitle() }}</h1>
      <p class="app-text-muted text-sm">{{ getListDescription() }}</p>
    </div>
    <a
      routerLink="/dashboard/programs/create"
      class="app-btn app-btn-primary px-4 py-2 font-medium flex items-center gap-2 text-sm">
      Créer un programme
    </a>
  </div>

  <div *ngIf="loading" class="flex justify-center py-12">
    <app-loading-spinner message="Chargement des programmes..."></app-loading-spinner>
  </div>

  <div *ngIf="error && !loading" class="app-alert-danger">
    {{ error }}
  </div>

  <div *ngIf="!loading">
    <div *ngIf="programs.length === 0" class="app-card px-6 py-8 text-center text-gray-500 text-sm">
      Aucun programme trouvé.
    </div>

    <div *ngIf="programs.length > 0" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <app-item-program
        *ngFor="let program of programs"
        [program]="program"
        (actionClick)="onViewDetail($event)">
      </app-item-program>
    </div>

    <app-pagination
      [total]="total"
      [page]="page"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>
  </div>
</div>
