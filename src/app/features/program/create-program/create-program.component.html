<div class="max-w-6xl mx-auto space-y-4 py-2">
  <!-- Stepper Horizontal Premium -->
  <div class="relative max-w-2xl mx-auto px-4 mb-1">
    <div class="flex items-center justify-between relative z-10">
      <!-- Étape 1 -->
      <div class="flex flex-col items-center">
        <div class="app-step-circle"
          [ngClass]="{
            'app-step-circle--active': currentStep === 1,
            'app-step-circle--done': currentStep > 1,
            'app-step-circle--upcoming': currentStep < 1
          }">
          <span *ngIf="currentStep <= 1">1</span>
          <span *ngIf="currentStep > 1" class="material-symbols-outlined text-sm font-bold">check</span>
        </div>
        <span class="app-step-label"
          [ngClass]="{'app-step-label--active': currentStep === 1, 'app-step-label--done': currentStep > 1}">
          Général
        </span>
      </div>

      <!-- Connecteur 1-2 -->
      <div class="app-step-connector" [ngClass]="{'app-step-connector--done': currentStep > 1, 'app-step-connector--upcoming': currentStep <= 1}"></div>

      <!-- Étape 2 -->
      <div class="flex flex-col items-center">
        <div class="app-step-circle"
          [ngClass]="{
            'app-step-circle--active': currentStep === 2,
            'app-step-circle--done': currentStep > 2,
            'app-step-circle--upcoming': currentStep < 2
          }">
          <span *ngIf="currentStep <= 2">2</span>
          <span *ngIf="currentStep > 2" class="material-symbols-outlined text-sm font-bold">check</span>
        </div>
        <span class="app-step-label"
          [ngClass]="{'app-step-label--active': currentStep === 2, 'app-step-label--done': currentStep > 2}">
          Circuit
        </span>
      </div>

      <!-- Connecteur 2-3 -->
      <div class="app-step-connector" [ngClass]="{'app-step-connector--done': currentStep > 2, 'app-step-connector--upcoming': currentStep <= 2}"></div>

      <!-- Étape 3 -->
      <div class="flex flex-col items-center">
        <div class="app-step-circle"
          [ngClass]="{
            'app-step-circle--active': currentStep === 3,
            'app-step-circle--done': currentStep > 3,
            'app-step-circle--upcoming': currentStep < 3
          }">
          <span *ngIf="currentStep <= 3">3</span>
          <span *ngIf="currentStep > 3" class="material-symbols-outlined text-sm font-bold">check</span>
        </div>
        <span class="app-step-label"
          [ngClass]="{'app-step-label--active': currentStep === 3, 'app-step-label--done': currentStep > 3}">
          Validation
        </span>
      </div>

      <!-- Connecteur 3-4 -->
      <div class="app-step-connector" [ngClass]="{'app-step-connector--done': currentStep > 3, 'app-step-connector--upcoming': currentStep <= 3}"></div>

      <!-- Étape 4 -->
      <div class="flex flex-col items-center">
        <div class="app-step-circle"
          [ngClass]="{
            'app-step-circle--active': currentStep === 4,
            'app-step-circle--done': currentStep > 4,
            'app-step-circle--upcoming': currentStep < 4
          }">
          <span *ngIf="currentStep <= 4">4</span>
          <span *ngIf="currentStep > 4" class="material-symbols-outlined text-sm font-bold">check</span>
        </div>
        <span class="app-step-label"
          [ngClass]="{'app-step-label--active': currentStep === 4, 'app-step-label--done': currentStep > 4}">
          Signature
        </span>
      </div>
    </div>
  </div>

  <div class="mt-2 relative z-20 app-fade-slide-in">
    <div class="app-card border-none shadow-lg shadow-slate-200/30 overflow-hidden p-4">
      <app-step-one *ngIf="currentStep === 1" [initialValue]="draftProgram" (validated)="onUpdateGeneral($event)">
      </app-step-one>

      <app-step-two *ngIf="currentStep === 2" [documents]="draftProgram.documents" [initialSteps]="draftProgram.steps"
        [users]="users" (back)="goToStep(1)" (validated)="onUpdateSteps($event)">
      </app-step-two>

      <app-step-three *ngIf="currentStep === 3" [program]="draftProgram" [users]="users" [loading]="loading"
        (back)="goToStep(2)" (requestOtp)="onRequestOtp()">
      </app-step-three>

      <app-step-four *ngIf="currentStep === 4" [loading]="loading" [email]="email" (back)="goToStep(3)"
        (submitOtp)="onSubmitProgram($event)">
      </app-step-four>
    </div>
  </div>
</div>
