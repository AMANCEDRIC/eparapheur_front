<div class="py-8 flex flex-col items-center justify-center space-y-5 animate-fade-slide-in">
  <div class="w-10 h-10 bg-primary/10 rounded-md flex items-center justify-center text-primary border border-primary/5">
    <span class="material-symbols-outlined text-xl">shield_lock</span>
  </div>

  <div class="text-center space-y-1 max-w-sm">
    <h2 class="text-base font-bold tracking-tight text-slate-900">Validation de sécurité</h2>
    <p class="text-[10px] text-slate-500 font-medium leading-relaxed px-4">
      Un code à 6 chiffres a été envoyé à <br>
      <span class="text-primary font-bold">{{ email }}</span>
    </p>
  </div>

  <div class="w-full max-w-[240px] space-y-5">
    <div class="space-y-1.5">
      <label class="block text-[8px] font-bold text-slate-400 uppercase tracking-widest text-center">Code de confirmation</label>
      <input
        type="text"
        [(ngModel)]="otp"
        name="otp"
        maxlength="6"
        class="w-full text-center tracking-[0.4em] text-lg font-bold py-2.5 rounded-md bg-slate-50 border border-slate-100 text-slate-900 focus:bg-white focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all placeholder:text-slate-200"
        placeholder="000000">
      <p class="text-[8px] text-center text-slate-300 italic mt-1.5">
        Vérifiez vos spams si besoin.
      </p>
    </div>

    <div class="flex flex-col gap-1.5">
      <button
        type="button"
        class="w-full bg-primary hover:bg-primary/90 disabled:opacity-50 text-white font-bold py-2 rounded-md transition-all shadow-md shadow-primary/10 flex items-center justify-center gap-2 text-[10px] uppercase tracking-widest"
        [disabled]="loading || otp.trim().length !== 6"
        (click)="onSubmit()">
        <span *ngIf="loading" class="material-symbols-outlined text-sm animate-spin">progress_activity</span>
        {{ loading ? 'Scellement...' : 'Confirmer' }}
      </button>
      
      <button
        type="button"
        class="w-full py-2 rounded-md text-slate-400 font-bold text-[9px] uppercase tracking-widest hover:text-slate-600 hover:bg-slate-50 transition-all flex items-center justify-center gap-1.5"
        (click)="onBack()">
        <span class="material-symbols-outlined text-sm">arrow_back</span>
        Retour
      </button>
    </div>
  </div>
</div>
