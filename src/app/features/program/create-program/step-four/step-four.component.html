<div class="space-y-6">
  <div class="app-card max-w-md space-y-4">
    <h2 class="text-xl font-semibold app-section-title">Validation par OTP</h2>
    <p class="app-text-muted text-sm">
      Un code à 6 chiffres a été envoyé à l'adresse
      <span class="font-medium text-slate-800">{{ email }}</span>. Saisissez-le pour créer le programme.
    </p>
    <div>
      <label class="block text-sm font-medium app-label-important mb-1">
        Code OTP
      </label>
      <input
        type="text"
        [(ngModel)]="otp"
        name="otp"
        maxlength="6"
        class="app-input text-center tracking-[0.4em] text-lg font-semibold"
        placeholder="______">
      <p class="text-xs app-text-muted mt-1">
        Entrez les 6 chiffres reçus par email.
      </p>
    </div>
  </div>

  <div class="flex justify-between pt-4">
    <button
      type="button"
      class="app-btn app-btn-outline text-sm px-4 py-2"
      (click)="onBack()">
      Retour
    </button>
    <button
      type="button"
      class="app-btn app-btn-primary text-sm px-4 py-2 disabled:opacity-50"
      [disabled]="loading || otp.trim().length !== 6"
      (click)="onSubmit()">
      {{ loading ? 'Création en cours...' : 'Créer le programme' }}
    </button>
  </div>
</div>
