<div class="py-4 flex flex-col items-center justify-center animate-fade-slide-in">
  <!-- Icone Réduite -->
  <div class="w-10 h-10 bg-primary/10 rounded-xl flex items-center justify-center text-primary border border-primary/10 shadow-inner mb-4">
    <span class="material-symbols-outlined text-xl font-variation-fill-1">shield_lock</span>
  </div>

  <div class="w-full max-w-[280px] space-y-4">
    <!-- Message & Email -->
    <div class="text-center space-y-1.5">
      <h3 class="text-[11px] font-black text-slate-900 uppercase tracking-widest leading-none">Validation OTP</h3>
      <p class="text-[9px] text-slate-500 font-bold uppercase tracking-tight">Code envoyé à :</p>
      <div class="bg-slate-50 border border-slate-200 py-1.5 px-3 rounded text-center">
        <span class="text-primary font-black text-[10px]">{{ email }}</span>
      </div>
    </div>

    <!-- Saisie OTP -->
    <div class="space-y-2">
      <label class="block text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] text-center">Saisir le code</label>
      <input
        type="text"
        [(ngModel)]="otp"
        name="otp"
        maxlength="6"
        inputmode="numeric"
        class="w-full text-center tracking-[0.5em] text-lg font-black py-2 rounded-lg bg-slate-50 border border-slate-200 text-slate-900 focus:bg-white focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none shadow-sm placeholder:text-slate-200"
        placeholder="000000">
    </div>

    <!-- Actions -->
    <div class="flex flex-col gap-2 pt-1">
      <button
        type="button"
        class="w-full bg-primary hover:bg-primary/90 disabled:opacity-50 text-white font-black py-2.5 rounded-lg transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2 text-[10px] uppercase tracking-widest active:scale-[0.98]"
        [disabled]="loading || otp.trim().length !== 6"
        (click)="onSubmit()">
        <span *ngIf="loading" class="material-symbols-outlined text-lg animate-spin">progress_activity</span>
        <span *ngIf="!loading" class="material-symbols-outlined text-lg">verified</span>
        {{ loading ? '...' : 'CONFIRMER LE LANCEMENT' }}
      </button>
      
      <button
        type="button"
        class="w-full py-1.5 rounded text-slate-400 font-black text-[9px] uppercase tracking-widest hover:text-slate-600 transition-all flex items-center justify-center gap-1"
        (click)="onBack()">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        RETOUR
      </button>
    </div>
  </div>
</div>
