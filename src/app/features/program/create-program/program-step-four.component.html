<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl font-semibold text-slate-900">Validation par OTP</h2>
      <p class="text-slate-500 text-sm">
        Un code à 6 chiffres a été envoyé à l’adresse <span class="font-medium">{{ email }}</span>. Saisissez-le pour créer le programme.
      </p>
    </div>
  </div>

  <div class="max-w-md space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Code OTP</label>
      <input
        type="text"
        [(ngModel)]="otp"
        name="otp"
        maxlength="6"
        class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-center tracking-[0.5em] text-lg"
        placeholder="______">
      <p class="text-xs text-slate-500 mt-1">
        Entrez les 6 chiffres reçus par email.
      </p>
    </div>
  </div>

  <div class="flex justify-between pt-4">
    <button
      type="button"
      class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md hover:bg-slate-50"
      (click)="onBack()">
      Retour
    </button>
    <button
      type="button"
      class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-md shadow-sm hover:bg-indigo-700 disabled:opacity-50"
      [disabled]="loading || otp.trim().length !== 6"
      (click)="onSubmit()">
      {{ loading ? 'Création en cours...' : 'Créer le programme' }}
    </button>
  </div>
</div>
