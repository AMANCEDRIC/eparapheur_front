<div class="space-y-4 animate-fade-slide-in">
  <!-- Header de section -->
  <div class="flex items-center justify-between pb-3 border-b border-slate-100">
    <div class="space-y-0.5">
      <h3 class="text-xs font-black text-slate-900 uppercase tracking-widest leading-none">Configuration du flux</h3>
      <p class="text-slate-500 text-[10px] font-medium uppercase tracking-tight">Définissez l'ordre et les intervenants.</p>
    </div>
    <button
      type="button"
      (click)="addStep()"
      class="flex items-center gap-1.5 bg-primary/10 text-primary hover:bg-primary/20 px-3 py-1.5 rounded-lg font-black text-[10px] uppercase tracking-widest transition-all">
      <span class="material-symbols-outlined text-base">add_circle</span>
      AJOUTER
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onNext()" class="space-y-4">
    <!-- Liste vide -->
    <div *ngIf="steps.length === 0" class="flex flex-col items-center justify-center py-8 bg-slate-50/50 border-2 border-dashed border-slate-200 rounded-lg transition-all hover:bg-white">
      <span class="material-symbols-outlined text-3xl text-slate-200 mb-2">route</span>
      <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest">Aucune étape définie</p>
      <button (click)="addStep()" type="button" class="mt-2 text-primary font-black text-[10px] uppercase tracking-widest hover:underline">Initialiser le circuit</button>
    </div>

    <!-- Container des étapes -->
    <div formArrayName="steps" class="space-y-3">
      <div
        *ngFor="let step of steps; let i = index"
        [formGroupName]="i"
        class="bg-white border rounded-lg shadow-sm overflow-hidden transition-all duration-300 group"
        [ngClass]="i === steps.length - 1 ? 'border-primary/30 ring-1 ring-primary/5' : 'border-slate-200'">

        <div class="p-4">
          <!-- Top row: Name & Description -->
          <div class="flex justify-between items-start mb-4">
            <div class="flex items-center gap-3 flex-1">
              <div class="w-8 h-8 rounded flex items-center justify-center font-black text-xs transition-all shadow-sm shrink-0"
                [ngClass]="i === steps.length - 1 ? 'bg-primary text-white' : 'bg-slate-100 text-slate-400'">
                {{ i + 1 }}
              </div>
              <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="flex flex-col gap-1">
                  <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nom de l'étape</label>
                  <input
                    type="text"
                    formControlName="name"
                    class="w-full bg-slate-50/50 border border-slate-200 px-3 py-1.5 rounded font-bold text-xs focus:border-primary focus:ring-4 focus:ring-primary/5 text-slate-900 outline-none transition-all placeholder:text-slate-300"
                    placeholder="Ex: Validation Direction">
                </div>
                <div class="flex flex-col gap-1">
                  <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Instructions</label>
                  <input
                    type="text"
                    formControlName="description"
                    class="w-full bg-transparent border-b border-slate-200 py-1.5 text-[11px] font-medium text-slate-600 outline-none focus:border-primary transition-all placeholder:text-slate-300"
                    placeholder="Consignes particulières...">
                </div>
              </div>
            </div>
            <button
              type="button"
              (click)="removeStep(i)"
              class="ml-4 w-8 h-8 flex items-center justify-center rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-all">
              <span class="material-symbols-outlined text-xl">delete</span>
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-3 border-t border-slate-50">
            <!-- Left col: Action and Documents -->
            <div class="space-y-4">
              <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Action à réaliser</label>
                <div class="relative">
                  <select
                    formControlName="actionType"
                    (change)="onActionTypeChange(i)"
                    class="w-full rounded border border-slate-200 bg-slate-50/50 outline-none text-slate-900 font-bold focus:border-primary focus:ring-4 focus:ring-primary/5 text-xs h-9 px-3 appearance-none transition-all">
                    <option value="SIGN">Signature Électronique</option>
                    <option value="VALIDATION">Validation & Revue</option>
                    <option value="PARAPHER">Parapheur simple</option>
                  </select>
                  <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">expand_more</span>
                </div>
              </div>

              <div class="flex flex-col gap-1.5">
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Documents concernés</label>
                <div class="bg-slate-50/30 border border-slate-200 rounded p-2 max-h-24 overflow-y-auto space-y-1">
                  <label
                    *ngFor="let doc of documents; let di = index"
                    class="flex items-center gap-2 p-1.5 rounded hover:bg-white hover:shadow-sm transition-all cursor-pointer group/doc">
                    <input
                      type="checkbox"
                      [checked]="isDocumentSelected(step, di)"
                      (change)="toggleDocumentForStep(step, di)"
                      class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary/20 transition-all">
                    <span class="text-[11px] font-bold text-slate-700 truncate group-hover/doc:text-primary transition-colors">{{ doc.documentName }}</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Right col: Participants -->
            <div class="flex flex-col gap-1.5">
              <div class="flex items-center justify-between">
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Intervenants</label>
                <button (click)="openParticipantModal(step)" type="button" class="text-[10px] font-black text-primary hover:underline flex items-center gap-1">
                  <span class="material-symbols-outlined text-base">person_add</span>
                  GÉRER
                </button>
              </div>
              <div class="bg-slate-50/30 border border-slate-200 rounded p-3 min-h-[104px] flex flex-wrap gap-2 content-start shadow-inner">
                <div *ngIf="step.participants.length === 0" class="w-full h-full flex flex-col items-center justify-center opacity-40 py-4">
                  <span class="material-symbols-outlined text-2xl mb-1 text-slate-300">group_off</span>
                  <p class="text-[9px] font-black uppercase tracking-widest text-slate-400">Aucun intervenant ajouté</p>
                </div>
                <div
                  *ngFor="let p of step.participants; let pi = index"
                  class="flex items-center gap-2 bg-white border border-slate-200 pl-2 pr-1.5 py-1.5 rounded shadow-sm group/tag transition-all hover:border-primary/40">
                  <div class="w-5 h-5 rounded bg-primary/5 flex items-center justify-center text-[9px] font-black text-primary border border-primary/10">
                    {{ getParticipantName(p.accountId).charAt(0).toUpperCase() }}
                  </div>
                  <span class="text-[11px] font-bold text-slate-700 truncate max-w-[120px]">{{ getParticipantName(p.accountId) }}</span>
                  <button (click)="removeParticipant(step, pi)" type="button" class="w-5 h-5 flex items-center justify-center rounded text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition-all">
                    <span class="material-symbols-outlined text-base">close</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Info Sécurité -->
        <div *ngIf="step.actionType === 'SIGN'" class="bg-primary/[0.03] px-4 py-2 flex items-center gap-2 border-t border-primary/10">
          <span class="material-symbols-outlined text-primary text-base font-variation-fill-1">shield_lock</span>
          <p class="text-[10px] font-black text-primary uppercase tracking-[0.15em]">Validation par OTP obligatoire</p>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <div class="flex items-center justify-between pt-4 border-t border-slate-100">
      <button
        type="button"
        (click)="onBack()"
        class="flex items-center gap-2 px-5 py-2.5 rounded-lg border border-slate-200 text-slate-600 font-black text-[10px] uppercase tracking-widest hover:bg-slate-50 transition-all">
        <span class="material-symbols-outlined text-lg">arrow_back</span>
        PRÉCÉDENT
      </button>
      <div class="flex items-center gap-3">
        <button
          type="submit"
          [disabled]="!isValid()"
          class="flex items-center justify-center gap-2 app-btn app-btn-primary !px-8 !py-2.5 disabled:opacity-50 disabled:cursor-not-allowed shadow-xl shadow-primary/20 text-[10px] font-black uppercase tracking-widest">
          SUIVANT
          <span class="material-symbols-outlined text-xl">arrow_forward</span>
        </button>
      </div>
    </div>
  </form>

  <app-user-selection-modal
    [isOpen]="isModalOpen"
    [users]="users"
    [selectedUserIds]="currentStepForModal ? getSelectedUserIdsForStep(currentStepForModal) : []"
    (close)="onModalClose()"
    (validate)="onUsersSelected($event)">
  </app-user-selection-modal>
</div>
