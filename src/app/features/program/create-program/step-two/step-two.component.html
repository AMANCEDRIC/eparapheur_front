<div class="space-y-4 animate-fade-slide-in">
  <!-- Header de section -->
  <div class="flex items-center justify-between pb-2 border-b border-slate-100">
    <div class="space-y-0.5">
      <h3 class="text-base font-bold text-slate-900">Configuration du flux</h3>
      <p class="text-slate-500 text-[10px]">Définition de l'ordre et des règles de validation.</p>
    </div>
    <button
      type="button"
      (click)="addStep()"
      class="flex items-center gap-1.5 bg-primary/10 text-primary hover:bg-primary/20 px-3 py-1.5 rounded-md font-bold text-[9px] uppercase tracking-widest transition-all">
      <span class="material-symbols-outlined text-sm">add</span>
      Ajouter
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onNext()" class="space-y-4">
    <!-- Liste vide -->
    <div *ngIf="steps.length === 0" class="flex flex-col items-center justify-center py-10 bg-slate-50 border-2 border-dashed border-slate-100 rounded-md">
      <span class="material-symbols-outlined text-3xl text-slate-200 mb-2">route</span>
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Aucune étape définie</p>
      <button (click)="addStep()" type="button" class="mt-1 text-primary font-bold text-[9px] uppercase tracking-widest hover:underline">Initialiser le circuit</button>
    </div>

    <!-- Container des étapes -->
    <div formArrayName="steps" class="space-y-3">
      <div
        *ngFor="let step of steps; let i = index"
        [formGroupName]="i"
        class="bg-white border rounded-md shadow-sm overflow-hidden transition-all group"
        [ngClass]="i === steps.length - 1 ? 'border-primary/30' : 'border-slate-100'">

        <div class="p-3">
          <div class="flex justify-between items-start mb-2">
            <div class="flex items-center gap-2.5">
              <div class="w-6 h-6 rounded-full flex items-center justify-center font-bold text-[10px] transition-all"
                [ngClass]="i === steps.length - 1 ? 'bg-primary text-white' : 'bg-slate-100 text-slate-400'">
                {{ i + 1 }}
              </div>
              <div class="flex justify-between  gap-7">
                <input
                  type="text"
                  formControlName="name"
                  class="bg-slate-90 border border-slate-300 px-2 py-0.5 rounded-sm font-bold text-sm focus:ring-1 focus:ring-primary/10 text-slate-900 w-full placeholder:text-slate-200 outline-none transition-all"
                  placeholder="Nom de l'étape...">
                <input
                  type="text"
                  formControlName="description"
                  class="bg-transparent border-none p-0 text-[9px] text-slate-400 outline-none focus:ring-0 w-full placeholder:text-slate-300 mt-0.5"
                  placeholder="Objectif de cette validation...">
              </div>
            </div>
            <button
              type="button"
              (click)="removeStep(i)"
              class="text-slate-200 hover:text-rose-500 transition-colors">
              <span class="material-symbols-outlined text-base">delete</span>
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Action et Documents -->
            <div class="space-y-2.5">
              <div class="flex flex-col gap-1">
                <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Type d'action</label>
                <div class="relative">
                  <select
                    formControlName="actionType"
                    (change)="onActionTypeChange(i)"
                    class="w-full rounded-md border border-slate-300 bg-slate-90/90 outline-none text-slate-900 focus:border-primary focus:ring-1 focus:ring-primary/20 text-[11px] h-7 px-2.5 appearance-none">
                    <option value="SIGN">Signature Électronique</option>
                    <option value="VALIDATION">Revue & Validation</option>
                    <option value="PARAPHER">Parapheur simple</option>
                  </select>
                  <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-xs">expand_more</span>
                </div>
              </div>

              <div class="flex flex-col gap-1">
                <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Documents</label>
                <div class="bg-slate-90/90 border border-slate-200 rounded-md p-1.5 max-h-24 overflow-y-auto space-y-0.5">
                  <label
                    *ngFor="let doc of documents; let di = index"
                    class="flex items-center gap-2 p-1 rounded hover:bg-white transition-all cursor-pointer">
                    <input
                      type="checkbox"
                      [checked]="isDocumentSelected(step, di)"
                      (change)="toggleDocumentForStep(step, di)"
                      class="w-3 h-3 rounded border-slate-300 text-primary focus:ring-primary">
                    <span class="text-[9px] font-medium text-slate-600 truncate">{{ doc.documentName }}</span>
                  </label>
                </div>
              </div>
            </div>

            <!-- Participants -->
            <div class="flex flex-col gap-1">
              <div class="flex items-center justify-between">
                <label class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Destinataires</label>
                <button (click)="openParticipantModal(step)" type="button" class="text-[9px] font-bold text-primary hover:underline flex items-center gap-1">
                  <span class="material-symbols-outlined text-[10px]">group_add</span>
                  GÉRER
                </button>
              </div>
              <div class="bg-slate-50/50 border border-slate-200 rounded-md p-1.5 min-h-[80px] flex flex-wrap gap-1 content-start">
                <div *ngIf="step.participants.length === 0" class="w-full h-full flex flex-col items-center justify-center opacity-30 py-3">
                  <span class="material-symbols-outlined text-base">person_off</span>
                  <p class="text-[8px] font-bold uppercase tracking-tighter">Aucun participant</p>
                </div>
                <div
                  *ngFor="let p of step.participants; let pi = index"
                  class="flex items-center gap-1.5 bg-white border border-slate-200 pl-1.5 pr-1 py-0.5 rounded shadow-sm group/tag transition-all">
                  <span class="text-[9px] font-bold text-slate-700 truncate max-w-[100px]">{{ getParticipantName(p.accountId) }}</span>
                  <button (click)="removeParticipant(step, pi)" type="button" class="text-slate-300 hover:text-rose-500 transition-colors">
                    <span class="material-symbols-outlined text-[10px]">close</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Info Sécurité -->
        <div *ngIf="step.actionType === 'SIGN'" class="bg-primary/[0.03] px-3 py-1 flex items-center gap-1.5 border-t border-primary/10">
          <span class="material-symbols-outlined text-primary text-xs">shield_lock</span>
          <p class="text-[8px] font-bold text-primary uppercase tracking-widest">Sécurité renforcée</p>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <div class="flex items-center justify-between pt-3 border-t border-slate-100">
      <button
        type="button"
        (click)="onBack()"
        class="flex items-center gap-1.5 px-4 py-2 rounded-md border border-slate-200 text-slate-500 font-bold text-[10px] uppercase tracking-widest hover:bg-slate-50 transition-all">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        Précédent
      </button>
      <div class="flex items-center gap-2">
        <button type="button" class="px-4 py-2 rounded-md text-slate-300 font-bold text-[9px] hover:text-slate-400 transition-all uppercase tracking-widest">
          Brouillon
        </button>
        <button
          type="submit"
          [disabled]="!isValid()"
          class="flex items-center justify-center gap-2 app-btn-primary hover:app-btn-primary/90 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-2 px-6 rounded-md transition-all shadow-md shadow-primary/10 text-[10px] uppercase tracking-widest">
          Suivant
          <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </button>
      </div>
    </div>
  </form>

  <app-user-selection-modal
    [isOpen]="isModalOpen"
    [users]="users"
    [selectedUserIds]="currentStepForModal ? getSelectedUserIdsForStep(currentStepForModal) : []"
    (close)="onModalClose()"
    (validate)="onUsersSelected($event)">
  </app-user-selection-modal>
</div>
