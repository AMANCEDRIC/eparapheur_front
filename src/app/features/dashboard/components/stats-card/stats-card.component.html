<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
  <div class="flex justify-between items-start mb-4">
    <div [class]="'p-3 rounded-xl ' + getIconColorClass()">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="getIconPath()"></path>
      </svg>
    </div>
    <div *ngIf="trend" [class]="'flex items-center gap-1 text-sm font-medium ' + getTrendColorClass()">
      <svg *ngIf="isUp" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
      </svg>
      <svg *ngIf="!isUp" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
      </svg>
      {{ trend }}
    </div>
  </div>
  <p class="text-slate-500 text-sm font-medium">{{ title }}</p>
  <h3 class="text-2xl font-bold text-slate-900 mt-1">{{ value }}</h3>
</div>
