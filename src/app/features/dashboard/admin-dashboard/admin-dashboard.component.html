<div class="space-y-8">
  <!-- Header -->
  <div class="flex justify-between items-end">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Tableau de bord Administrateur</h1>
      <p class="text-slate-500">Gestion de l'application E-Parapheur</p>
    </div>
    <div class="flex gap-3">
      <button class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">
        Exporter PDF
      </button>
      <button class="px-4 py-2 bg-indigo-600 rounded-lg text-sm font-medium text-white hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-100">
        Nouveau Rapport
      </button>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <app-stats-card
      title="Total utilisateurs"
      [value]="totalUsers"
      icon="document-text"
      color="indigo"
      trend="+12.5%"
      [isUp]="true">
    </app-stats-card>
    <app-stats-card
      title="Utilisateurs actifs"
      [value]="0"
      icon="check-circle"
      color="emerald"
      trend="+5.2%"
      [isUp]="true">
    </app-stats-card>
    <app-stats-card
      title="En attente"
      [value]="0"
      icon="clock"
      color="sky"
      trend="-2.4%"
      [isUp]="false">
    </app-stats-card>
    <app-stats-card
      title="Documents signés"
      [value]="0"
      icon="document-text"
      color="rose"
      trend="+1.0%"
      [isUp]="true">
    </app-stats-card>
  </div>

  <!-- Quick Actions -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-xl font-semibold mb-4 text-slate-900">Actions rapides</h2>
      <div class="space-y-3">
        <button
          routerLink="/admin/users"
          class="w-full bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition-colors text-left">
          Gérer les utilisateurs
        </button>
        <button
          routerLink="/admin/users"
          class="w-full bg-emerald-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-emerald-700 transition-colors text-left">
          Créer un utilisateur
        </button>
      </div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h2 class="text-xl font-semibold mb-4 text-slate-900">Statistiques</h2>
      <p class="text-slate-500">Graphiques et statistiques détaillées (à implémenter)</p>
    </div>
  </div>
</div>
