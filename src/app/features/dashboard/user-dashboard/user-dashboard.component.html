<div class="space-y-8">
  <!-- Header -->
  <div class="flex justify-between items-end">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Tableau de Bord</h1>
      <p class="text-slate-500">Bienvenue, voici un aperçu de l'activité aujourd'hui.</p>
    </div>
    <div class="flex gap-3">
      <button class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">
        Exporter PDF
      </button>
      <button class="px-4 py-2 bg-indigo-600 rounded-lg text-sm font-medium text-white hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-100">
        Nouveau Rapport
      </button>
    </div>
  </div>

  <!-- Stat Cards -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <div 
      *ngFor="let s of stats"
      class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex justify-between items-start mb-4">
        <div [class]="'p-3 rounded-xl ' + getIconColorClass(s.color)">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <div [class]="'flex items-center gap-1 text-sm font-medium ' + getTrendColorClass(s.isUp)">
          <svg *ngIf="s.isUp" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
          </svg>
          <svg *ngIf="!s.isUp" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
          </svg>
          {{ s.trend }}
        </div>
      </div>
      <p class="text-slate-500 text-sm font-medium">{{ s.label }}</p>
      <h3 class="text-2xl font-bold text-slate-900 mt-1">{{ s.value }}</h3>
    </div>
  </div>

  <!-- Programs Section -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Programs List -->
    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <h3 class="font-bold text-slate-900 mb-6">Derniers programmes de signature</h3>
      <div class="space-y-4">
        <div
          *ngFor="let p of programs"
          class="bg-slate-900 text-white p-5 rounded-xl shadow-sm flex items-center justify-between hover:bg-slate-800 transition-colors cursor-pointer">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 border border-white/15 rounded-lg flex items-center justify-center bg-white/5">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            <div>
              <div class="text-sm font-semibold">{{ p.title }}</div>
              <div class="text-xs text-slate-300 mt-1">{{ p.date }}</div>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-300">Signataires</span>
              <div class="flex items-center gap-1">
                <span
                  *ngFor="let s of p.signers"
                  class="px-2.5 py-1 rounded-full bg-white/10 text-xs flex items-center border border-white/10">
                  {{ s }}
                </span>
              </div>
            </div>
            <div class="flex items-center gap-2 text-xs">
              <span class="w-2 h-2 bg-emerald-400 rounded-full"></span>
              <span>{{ p.status }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Signature Panel -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 h-fit">
      <div class="p-6 flex flex-col items-center justify-center text-slate-600 min-h-[320px]">
        <div class="w-16 h-16 rounded-2xl bg-rose-50 flex items-center justify-center text-rose-400 mb-4">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </div>
        <div class="text-sm font-medium text-center">Ajoutez une signature</div>
      </div>
    </div>
  </div>
</div>
