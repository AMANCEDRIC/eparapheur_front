<div class="min-h-screen flex items-center justify-center app-bg-layout py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Réinitialiser le mot de passe
      </h2>
      <p class="mt-2 text-center text-sm app-text-muted">
        Entrez votre nouveau mot de passe
      </p>
    </div>

    <app-card>
      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <app-alert
          *ngIf="error"
          type="error"
          title="DIGISIGN E-PARAPHEUR"
          [message]="error"
          (close)="error = ''">
        </app-alert>
        <app-alert
          *ngIf="success"
          type="success"
          title="DIGISIGN E-PARAPHEUR"
          message="Mot de passe réinitialisé avec succès ! Redirection vers la page de connexion..."
          [closable]="false">
        </app-alert>

        <div class="space-y-4">
          <app-input
            formControlName="password"
            type="password"
            label="Nouveau mot de passe"
            placeholder="Entrez votre nouveau mot de passe"
            [required]="true"
            icon="lock">
          </app-input>

          <!-- Password Strength Indicator & Instructions -->
          <div class="p-3 bg-blue-50 border border-blue-100 rounded-lg space-y-3">
            <div class="flex items-center gap-2 text-blue-800 font-medium text-xs">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
              </svg>
              Exigences du mot de passe
            </div>

            <div class="flex gap-1 h-1">
              <div *ngFor="let step of [1,2,3,4]"
                   class="flex-1 rounded-full transition-colors duration-300"
                   [class.bg-blue-200]="passwordStrength < step"
                   [class.bg-red-500]="passwordStrength >= step && passwordStrength === 1"
                   [class.bg-orange-500]="passwordStrength >= step && passwordStrength === 2"
                   [class.bg-yellow-500]="passwordStrength >= step && passwordStrength === 3"
                   [class.bg-emerald-500]="passwordStrength >= step && passwordStrength === 4">
              </div>
            </div>

            <ul class="text-[10px] space-y-1.5">
              <li class="flex items-center gap-1.5" [class.text-emerald-600]="hasLength" [class.text-blue-400]="!hasLength">
                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                Au moins 8 caractères
              </li>
              <li class="flex items-center gap-1.5" [class.text-emerald-600]="hasUpper" [class.text-blue-400]="!hasUpper">
                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                Une majuscule
              </li>
              <li class="flex items-center gap-1.5" [class.text-emerald-600]="hasNumber" [class.text-blue-400]="!hasNumber">
                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                Un chiffre
              </li>
              <li class="flex items-center gap-1.5" [class.text-emerald-600]="hasSpecial" [class.text-blue-400]="!hasSpecial">
                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                Un caractère spécial (!&#64;#$%^&*)
              </li>
            </ul>
          </div>

          <app-input
            formControlName="confirmPassword"
            type="password"
            label="Confirmer le mot de passe"
            placeholder="Confirmez votre mot de passe"
            [required]="true"
            icon="lock">
          </app-input>
          <p *ngIf="resetPasswordForm.errors?.['passwordMismatch'] && resetPasswordForm.get('confirmPassword')?.touched" class="text-xs text-red-500">
            Les mots de passe ne correspondent pas.
          </p>
        </div>

        <div class="pt-4">
          <app-button
            type="submit"
            [loading]="loading"
            [disabled]="resetPasswordForm.invalid || loading || success || passwordStrength < 4"
            [fullWidth]="true">
            Réinitialiser
          </app-button>
        </div>

        <div class="text-center mt-4">
          <a routerLink="/login" class="text-sm font-medium app-link-primary">
            Retour à la connexion
          </a>
        </div>
      </form>
    </app-card>
  </div>
</div>
