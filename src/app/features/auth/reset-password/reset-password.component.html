<div class="min-h-screen flex items-center justify-center app-bg-layout py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Réinitialiser le mot de passe
      </h2>
      <p class="mt-2 text-center text-sm app-text-muted">
        Entrez votre nouveau mot de passe
      </p>
    </div>

    <app-card>
      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div *ngIf="error" class="app-alert-danger">
          {{ error }}
        </div>

        <div *ngIf="success" class="app-alert-success">
          Mot de passe réinitialisé avec succès. Redirection...
        </div>

        <app-input
          formControlName="password"
          type="password"
          label="Nouveau mot de passe"
          placeholder="Entrez votre nouveau mot de passe"
          [required]="true"
          [error]="resetPasswordForm.get('password')?.hasError('required') && resetPasswordForm.get('password')?.touched ? 'Le mot de passe est requis' : resetPasswordForm.get('password')?.hasError('minlength') && resetPasswordForm.get('password')?.touched ? 'Le mot de passe doit contenir au moins 6 caractères' : ''">
        </app-input>

        <app-input
          formControlName="confirmPassword"
          type="password"
          label="Confirmer le mot de passe"
          placeholder="Confirmez votre mot de passe"
          [required]="true"
          [error]="resetPasswordForm.get('confirmPassword')?.hasError('required') && resetPasswordForm.get('confirmPassword')?.touched ? 'La confirmation est requise' : resetPasswordForm.get('confirmPassword')?.hasError('passwordMismatch') && resetPasswordForm.get('confirmPassword')?.touched ? 'Les mots de passe ne correspondent pas' : ''">
        </app-input>

        <app-button
          type="submit"
          variant="primary"
          [loading]="loading"
          [disabled]="resetPasswordForm.invalid || loading || success"
          [fullWidth]="true">
          Réinitialiser
        </app-button>

        <div class="text-center">
          <a routerLink="/login" class="text-sm font-medium app-link-primary">
            Retour à la connexion
          </a>
        </div>
      </form>
    </app-card>
  </div>
</div>
