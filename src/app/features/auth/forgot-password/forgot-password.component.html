<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Mot de passe oublié
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Entrez votre email pour recevoir un lien de réinitialisation
      </p>
    </div>

    <app-card>
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div *ngIf="error" class="bg-danger/10 border border-danger text-danger px-4 py-3 rounded">
          {{ error }}
        </div>

        <div *ngIf="success" class="bg-success/10 border border-success text-success px-4 py-3 rounded">
          Un email de réinitialisation a été envoyé à votre adresse.
        </div>

        <app-input
          formControlName="email"
          type="email"
          label="Email"
          placeholder="votre@email.com"
          [required]="true"
          [error]="forgotPasswordForm.get('email')?.hasError('required') && forgotPasswordForm.get('email')?.touched ? 'L\'email est requis' : forgotPasswordForm.get('email')?.hasError('email') && forgotPasswordForm.get('email')?.touched ? 'Email invalide' : ''">
        </app-input>

        <app-button
          type="submit"
          variant="primary"
          [loading]="loading"
          [disabled]="forgotPasswordForm.invalid || loading || success"
          [fullWidth]="true">
          Envoyer le lien
        </app-button>

        <div class="text-center">
          <a routerLink="/login" class="text-sm font-medium text-primary hover:text-blue-700">
            Retour à la connexion
          </a>
        </div>
      </form>
    </app-card>
  </div>
</div>
