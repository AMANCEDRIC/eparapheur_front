<div class="min-h-screen flex items-center justify-center app-bg-layout py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-6">
    <!-- Logo/Brand -->
    <div class="text-center">
      <div class="mb-4 flex justify-center">
        <img src="assets/images/logos/Logo_BOAD.png" alt="BOAD Logo" class="h-14 w-auto object-contain">
      </div>
      <h2 class="text-xl font-bold text-slate-900 tracking-tight">Mot de passe oublié</h2>
      <p class="mt-1.5 text-xs text-slate-500 font-medium">
        Entrez votre email pour recevoir un lien de réinitialisation
      </p>
    </div>

    <app-card>
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-5 p-2">
        <app-alert
          *ngIf="error"
          type="error"
          title="ERREUR"
          [message]="error"
          (close)="error = ''">
        </app-alert>

        <app-alert
          *ngIf="success"
          type="success"
          title="EMAIL ENVOYÉ"
          [message]="message"
          (close)="success = false">
        </app-alert>

        <div class="space-y-4">
          <app-input
            formControlName="email"
            type="email"
            label="Adresse email"
            placeholder="votre@email.com"
            [required]="true"
            icon="mail"
            [error]="forgotPasswordForm.get('email')?.hasError('required') && forgotPasswordForm.get('email')?.touched ? 'L\'email est requis' : forgotPasswordForm.get('email')?.hasError('email') && forgotPasswordForm.get('email')?.touched ? 'Email invalide' : ''">
          </app-input>
        </div>

        <div class="space-y-3 pt-2">
          <button
            type="submit"
            [disabled]="forgotPasswordForm.invalid || loading || success"
            class="app-btn app-btn-primary w-full justify-center text-[11px] uppercase tracking-widest font-bold h-9 shadow-sm disabled:opacity-60 disabled:cursor-not-allowed">
            <span *ngIf="loading" class="mr-2">
              <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
            </span>
            <span *ngIf="!loading">Envoyer le lien</span>
            <span *ngIf="loading">Envoi en cours...</span>
          </button>

          <button type="button" routerLink="/login"
            class="w-full text-[11px] text-slate-500 hover:text-slate-800 flex items-center justify-center font-bold transition-colors uppercase tracking-widest mt-3">
            <span class="material-symbols-outlined text-[14px] mr-1">arrow_back</span>
            Retour à la connexion
          </button>
        </div>
      </form>
    </app-card>
  </div>
</div>
