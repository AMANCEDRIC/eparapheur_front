<aside
  [class.w-[260px]]="isOpen"
  [class.w-20]="!isOpen"
  class="app-sidebar transition-all duration-300 flex flex-col min-h-screen fixed left-0 top-0 z-50 shadow-sm border-r border-slate-100 overflow-hidden">

  <!-- Logo Section -->
  <div class="h-24 flex flex-col items-center justify-center border-b border-border-subtle bg-slate-50/30">
    <div class="flex flex-col items-center justify-center transition-all duration-300"
         [class.scale-100]="isOpen" [class.scale-75]="!isOpen">
      <img
        src="assets/images/logos/Logo_BOAD.png"
        alt="Cryptoneo"
        class="h-12 w-auto object-contain transition-all duration-300" />
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto overflow-x-hidden">
    <!-- Main Menu -->
    <ng-container *ngIf="!isAdmin()">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}"
        class="app-sidebar-item flex items-center">
        <span class="material-symbols-outlined shrink-0">dashboard</span>
        <span class="flex-1 whitespace-nowrap transition-all duration-300 ease-in-out origin-left"
              [ngClass]="isOpen ? 'opacity-100 translate-x-0 ml-3' : 'opacity-0 -translate-x-2 w-0 ml-0'">
          Tableau de bord
        </span>
      </a>

      <a
        routerLink="/dashboard/signatures"
        routerLinkActive="active"
        class="app-sidebar-item flex items-center">
        <span class="material-symbols-outlined shrink-0">ink_pen</span>
        <span class="flex-1 whitespace-nowrap transition-all duration-300 ease-in-out origin-left"
              [ngClass]="isOpen ? 'opacity-100 translate-x-0 ml-3' : 'opacity-0 -translate-x-2 w-0 ml-0'">
          Mes signatures
        </span>
      </a>

      <div class="space-y-1">
        <button
          (click)="toggleProgramsMenu($event)"
          class="app-sidebar-item w-full flex items-center justify-between"
          [class.active]="isProgramsMenuOpen">
          <div class="flex items-center flex-1">
            <span class="material-symbols-outlined shrink-0">account_tree</span>
            <span class="flex-1 whitespace-nowrap transition-all duration-300 ease-in-out origin-left text-left"
                  [ngClass]="isOpen ? 'opacity-100 translate-x-0 ml-3' : 'opacity-0 -translate-x-2 w-0 ml-0'">
              Programmes
            </span>
          </div>
          <span
            class="material-symbols-outlined shrink-0 text-sm transition-all duration-300"
            [ngClass]="{
              'rotate-180': isProgramsMenuOpen && isOpen,
              'opacity-100': isOpen,
              'opacity-0 w-0': !isOpen
            }">
            expand_more
          </span>
        </button>

        <!-- Sub-menu Programs (Premium Collapsible) -->
        <div
          class="pl-12 space-y-1 overflow-hidden transition-all duration-300 ease-in-out"
          [ngClass]="{
            'max-h-0 opacity-0 scale-y-95 origin-top': !isProgramsMenuOpen || !isOpen,
            'max-h-48 opacity-100 scale-y-100 origin-top mt-1 mb-2': isProgramsMenuOpen && isOpen
          }">
          <a
            routerLink="/dashboard/programs/all"
            routerLinkActive="active"
            class="app-sidebar-item py-2 px-3 text-[11px] rounded-md whitespace-nowrap">
            Tous les programmes
          </a>
          <a
            routerLink="/dashboard/programs/my-creations"
            routerLinkActive="active"
            class="app-sidebar-item py-2 px-3 text-[11px] rounded-md whitespace-nowrap">
            Mes créations
          </a>
          <a
            routerLink="/dashboard/programs/involved"
            routerLinkActive="active"
            class="app-sidebar-item py-2 px-3 text-[11px] rounded-md whitespace-nowrap">
            Me concernant
          </a>
        </div>
      </div>
    </ng-container>

    <!-- Admin Section -->
    <div *ngIf="canAccessAdminSection()" class="pt-4 mt-4 border-t border-slate-100 space-y-1">
      <p class="px-4 mb-2 text-[9px] font-bold text-slate-400 uppercase tracking-widest whitespace-nowrap transition-all duration-300"
         [ngClass]="isOpen ? 'opacity-100' : 'opacity-0'">
        Administration
      </p>
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        class="app-sidebar-item flex items-center">
        <span class="material-symbols-outlined shrink-0">monitoring</span>
        <span class="flex-1 whitespace-nowrap transition-all duration-300 ease-in-out origin-left"
              [ngClass]="isOpen ? 'opacity-100 translate-x-0 ml-3' : 'opacity-0 -translate-x-2 w-0 ml-0'">
          Dashboard Admin
        </span>
      </a>
      <a
        *ngIf="canManageUsers()"
        routerLink="/admin/users"
        routerLinkActive="active"
        class="app-sidebar-item flex items-center">
        <span class="material-symbols-outlined shrink-0">group</span>
        <span class="flex-1 whitespace-nowrap transition-all duration-300 ease-in-out origin-left"
              [ngClass]="isOpen ? 'opacity-100 translate-x-0 ml-3' : 'opacity-0 -translate-x-2 w-0 ml-0'">
          Utilisateurs
        </span>
      </a>
    </div>
  </nav>

  <!-- Logout Section -->
  <div class="p-4 border-t border-slate-100">
    <button
      (click)="logout()"
      class="w-full app-sidebar-item hover:bg-rose-50 text-rose-500 group border-none flex items-center">
      <span class="material-symbols-outlined shrink-0">logout</span>
      <span class="flex-1 whitespace-nowrap transition-all duration-300 ease-in-out origin-left text-left"
            [ngClass]="isOpen ? 'opacity-100 translate-x-0 ml-3' : 'opacity-0 -translate-x-2 w-0 ml-0'">
        Déconnexion
      </span>
    </button>
  </div>
</aside>
