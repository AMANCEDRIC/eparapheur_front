<aside
  [class.w-[260px]]="isOpen"
  [class.w-20]="!isOpen"
  class="app-sidebar transition-all duration-300 flex flex-col min-h-screen fixed left-0 top-0 z-50 shadow-sm border-r border-slate-100">

  <!-- Logo Section -->
  <div class="h-24 flex flex-col items-center justify-center border-b border-border-subtle bg-slate-50/30">
    <div class="flex flex-col items-center justify-center">
      <img
        src="assets/images/logos/Logo_BOAD.png"
        alt="Cryptoneo"
        class="h-12 w-auto object-contain" />
<!--      <span class="text-[9px] font-bold text-text-secondary uppercase tracking-[0.2em] opacity-50 mt-2">Enterprise Edition</span>-->
    </div>
<!--    <div *ngIf="!isOpen">-->
<!--      <img-->
<!--        src="assets/icons/android-chrome-192x192.png"-->
<!--        alt="C"-->
<!--        class="h-10 w-auto object-contain" />-->
<!--    </div>-->
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
    <!-- Main Menu -->
    <ng-container *ngIf="!isAdmin()">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}"
        class="app-sidebar-item">
        <span class="material-symbols-outlined">dashboard</span>
        <span *ngIf="isOpen" class="flex-1">Tableau de bord</span>
      </a>

      <a
        routerLink="/dashboard/signatures"
        routerLinkActive="active"
        class="app-sidebar-item">
        <span class="material-symbols-outlined">ink_pen</span>
        <span *ngIf="isOpen" class="flex-1">Mes signatures</span>
      </a>

      <div class="space-y-1">
        <button
          (click)="toggleProgramsMenu($event)"
          class="app-sidebar-item w-full flex items-center justify-between"
          [class.active]="isProgramsMenuOpen">
          <div class="flex items-center gap-3.5">
            <span class="material-symbols-outlined">account_tree</span>
            <span *ngIf="isOpen" class="flex-1">Programmes</span>
          </div>
          <span
            *ngIf="isOpen"
            class="material-symbols-outlined text-sm transition-transform duration-300"
            [class.rotate-180]="isProgramsMenuOpen">
            expand_more
          </span>
        </button>

        <!-- Sub-menu Programs (Premium Collapsible) -->
        <div
          *ngIf="isOpen"
          class="pl-12 space-y-1 overflow-hidden transition-all duration-300"
          [ngClass]="{'max-h-0 opacity-0': !isProgramsMenuOpen, 'max-h-48 opacity-100 mt-1 mb-2': isProgramsMenuOpen}">
          <a
            routerLink="/dashboard/programs/all"
            routerLinkActive="active"
            class="app-sidebar-item py-2 px-3 text-[11px] rounded-md">
            Tous les programmes
          </a>
          <a
            routerLink="/dashboard/programs/my-creations"
            routerLinkActive="active"
            class="app-sidebar-item py-2 px-3 text-[11px] rounded-md">
            Mes créations
          </a>
          <a
            routerLink="/dashboard/programs/involved"
            routerLinkActive="active"
            class="app-sidebar-item py-2 px-3 text-[11px] rounded-md">
            Me concernant
          </a>
        </div>
      </div>
    </ng-container>

    <!-- Admin Section -->
    <div *ngIf="canAccessAdminSection()" class="pt-4 mt-4 border-t border-slate-100 space-y-1">
      <p *ngIf="isOpen" class="px-4 mb-2 text-[9px] font-bold text-slate-400 uppercase tracking-widest">Administration</p>
      <a
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        class="app-sidebar-item">
        <span class="material-symbols-outlined">monitoring</span>
        <span *ngIf="isOpen" class="flex-1">Dashboard Admin</span>
      </a>
      <a
        *ngIf="canManageUsers()"
        routerLink="/admin/users"
        routerLinkActive="active"
        class="app-sidebar-item">
        <span class="material-symbols-outlined">group</span>
        <span *ngIf="isOpen" class="flex-1">Utilisateurs</span>
      </a>
    </div>
  </nav>

  <!-- Logout Section -->
  <div class="p-4 border-t border-slate-100">
    <button
      (click)="logout()"
      class="w-full app-sidebar-item hover:bg-rose-50 text-rose-500 group border-none">
      <span class="material-symbols-outlined">logout</span>
      <span *ngIf="isOpen" class="flex-1">Déconnexion</span>
    </button>
  </div>
</aside>
