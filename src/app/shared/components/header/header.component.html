<header
  class="h-14 bg-white border-b border-border-subtle flex items-center justify-between px-4 z-40 sticky top-0 shadow-sm">
  <div class="flex items-center gap-4">
    <!-- Bouton toggle -->
    <button (click)="onToggleSidebar()"
      class="w-9 h-9 flex items-center justify-center rounded-lg text-text-secondary hover:bg-slate-50 hover:text-primary transition-all duration-300">
      <span class="material-symbols-outlined text-[22px]">
        {{ isSidebarOpen ? 'menu_open' : 'menu' }}
      </span>
    </button>

    <!-- Recherche Modernisée -->
    <div class="relative hidden lg:block group">
      <span
        class="absolute inset-y-0 left-0 flex items-center pl-3 text-text-secondary group-focus-within:text-primary transition-colors">
        <span class="material-symbols-outlined text-[18px]">search</span>
      </span>
      <input type="text" placeholder="Rechercher..."
        class="app-input !w-64 !bg-slate-50/50 !pl-9 !pr-4 !py-1.5 !text-[11px] !font-medium focus:!bg-white">
    </div>
  </div>

  <div class="flex items-center gap-2" *ngIf="currentUser">
    <!-- Notifications -->
    <button
      class="relative w-9 h-9 flex items-center justify-center rounded-lg text-text-secondary hover:bg-slate-50 hover:text-primary transition-all duration-300">
      <span class="material-symbols-outlined text-[20px]">notifications</span>
      <span class="absolute top-2 right-2 w-2 h-2 bg-danger rounded-full border-2 border-white"></span>
    </button>

    <div class="h-5 w-px bg-border-subtle mx-1.5"></div>

    <!-- Profil Utilisateur -->
    <button (click)="goToProfile()"
      class="flex items-center gap-2.5 pl-2 pr-1 py-1 rounded-lg transition-all hover:bg-slate-50 group">
      <div class="text-right hidden sm:block">
        <p class="text-[11px] font-bold text-text-primary leading-tight group-hover:text-primary transition-colors">{{
          getFullName() }}</p>
        <p class="app-label-bold !text-[8px] !leading-tight !mt-0.5 opacity-60">{{
          getProfileName() }}</p>
      </div>
      <div
        class="w-8 h-8 rounded-lg bg-primary text-white shadow-lg shadow-primary/30 flex items-center justify-center font-bold text-[11px] tracking-tight">
        {{ getInitials() }}
      </div>
    </button>
  </div>
</header>
