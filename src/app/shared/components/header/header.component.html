<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-40">
  <div class="flex items-center gap-4">
    <!-- Bouton toggle sidebar -->
    <button 
      (click)="onToggleSidebar()"
      class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition-colors">
      <svg *ngIf="isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
      <svg *ngIf="!isSidebarOpen" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    
    <div class="relative hidden md:block">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </span>
      <input 
        type="text" 
        placeholder="Rechercher..."
        class="pl-10 pr-4 py-2 bg-slate-100 border-transparent focus:bg-white focus:border-indigo-300 focus:ring-4 focus:ring-indigo-100 rounded-xl text-sm transition-all w-64">
    </div>
  </div>

  <div class="flex items-center gap-4" *ngIf="currentUser">
    <button class="relative p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <span class="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full border-2 border-white"></span>
    </button>
    <div class="h-8 w-px bg-slate-200 mx-2"></div>
    <button 
      (click)="goToProfile()"
      class="flex items-center gap-3 p-1 rounded-xl transition-all hover:bg-slate-50">
      <div class="text-right hidden sm:block px-2">
        <p class="text-sm font-semibold text-slate-900 leading-none mb-1">{{ getFullName() }}</p>
        <p class="text-xs text-slate-500 leading-none">{{ getProfileName() }}</p>
      </div>
      <div class="w-10 h-10 rounded-full bg-indigo-600 text-white shadow flex items-center justify-center font-semibold text-sm">
        {{ getInitials() }}
      </div>
    </button>
  </div>
</header>
