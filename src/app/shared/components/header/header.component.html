<header class="h-16 bg-white border-b border-slate-100 flex items-center justify-between px-6 z-40 sticky top-0">
  <div class="flex items-center gap-6">
    <!-- Bouton toggle -->
    <button 
      (click)="onToggleSidebar()"
      class="w-10 h-10 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-50 hover:text-primary transition-all duration-300">
      <span class="material-symbols-outlined text-[24px]">
        {{ isSidebarOpen ? 'menu_open' : 'menu' }}
      </span>
    </button>
    
    <!-- Recherche Modernisée -->
    <div class="relative hidden lg:block group">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 group-focus-within:text-primary transition-colors">
        <span class="material-symbols-outlined text-[18px]">search</span>
      </span>
      <input 
        type="text" 
        placeholder="Rechercher un document, un signataire..."
        class="w-80 bg-slate-50/50 border border-slate-100 rounded-lg pl-10 pr-4 py-2 text-[11px] font-medium focus:bg-white focus:border-primary/30 focus:ring-4 focus:ring-primary/5 transition-all outline-none placeholder:text-slate-400">
    </div>
  </div>

  <div class="flex items-center gap-3" *ngIf="currentUser">
    <!-- Notifications -->
    <button class="relative w-10 h-10 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-50 hover:text-primary transition-all duration-300">
      <span class="material-symbols-outlined text-[22px]">notifications</span>
      <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-rose-500 rounded-full border-2 border-white"></span>
    </button>
    
    <div class="h-6 w-px bg-slate-100 mx-2"></div>
    
    <!-- Profil Utilisateur -->
    <button 
      (click)="goToProfile()"
      class="flex items-center gap-3.5 pl-3 pr-1 py-1 rounded-xl transition-all hover:bg-slate-50 group">
      <div class="text-right hidden sm:block">
        <p class="text-[12px] font-bold text-slate-800 leading-tight group-hover:text-primary transition-colors">{{ getFullName() }}</p>
        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest leading-tight mt-0.5">{{ getProfileName() }}</p>
      </div>
      <div class="w-10 h-10 rounded-lg bg-primary text-white shadow-lg shadow-primary/20 flex items-center justify-center font-bold text-[13px] tracking-tight">
        {{ getInitials() }}
      </div>
    </button>
  </div>
</header>
