<div class="w-full">
  <label *ngIf="label" class="block text-xs font-medium app-label-important mb-1.5">
    {{ label }}
    <span *ngIf="required" class="text-danger">*</span>
  </label>
  <input
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="disabled"
    [required]="required"
    (input)="onInput($event)"
    (blur)="onTouched()"
    [class]="getInputClasses()" />
  <p *ngIf="error" class="mt-1 text-sm text-danger">{{ error }}</p>
</div>
