<div class="flex flex-col gap-1.5 w-full group">
  <label *ngIf="label" class="text-[10px] font-black text-slate-500 uppercase tracking-widest">
    {{ label }}
    <span *ngIf="required" class="text-rose-500 ml-0.5">*</span>
  </label>
  <div class="relative">
    <input
      [type]="currentType"
      [placeholder]="placeholder"
      [value]="value"
      [disabled]="disabled"
      [required]="required"
      (input)="onInput($event)"
      (blur)="onTouched()"
      [class]="getInputClasses()" />
    
    <span *ngIf="icon && type !== 'password'" class="material-symbols-outlined absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-300 pointer-events-none text-lg transition-colors group-focus-within:text-primary">{{ icon }}</span>

    <button 
      *ngIf="type === 'password'"
      type="button"
      (click)="togglePasswordVisibility()"
      class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-300 hover:text-primary focus:outline-none transition-colors">
      <span class="material-symbols-outlined text-lg">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
    </button>
  </div>
  <div *ngIf="error" class="text-[9px] text-rose-500 font-bold flex items-center gap-1 ml-1 mt-0.5">
    <span class="material-symbols-outlined text-[12px]">error</span>
    {{ error }}
  </div>
</div>
