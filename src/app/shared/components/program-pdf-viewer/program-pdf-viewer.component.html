<div class="h-full flex flex-col overflow-hidden bg-slate-50">
  <!-- Zone d'information Placement -->
  <div *ngIf="placementMode" class="px-4 py-2 bg-primary/5 border-b border-primary/10 flex items-center gap-2">
    <div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></div>
    <span class="text-[10px] font-bold text-primary uppercase tracking-widest">Placement du visuel</span>
    <span class="text-[10px] text-slate-500 font-medium ml-auto italic">Glissez le cadre sur le document</span>
  </div>

  <!-- Toolbar -->
  <div
    class="flex items-center justify-between px-4 py-2.5 bg-white border-b border-slate-100 shadow-sm z-10">
    
    <!-- Navigation Pages -->
    <div class="flex items-center gap-3">
      <div class="flex items-center bg-slate-100 p-1 rounded-lg">
        <button
          type="button"
          class="w-7 h-7 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm text-slate-500 transition-all disabled:opacity-30"
          (click)="prevPage()"
          [disabled]="page <= 1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <span class="px-3 text-[11px] font-bold text-slate-700 min-w-[70px] text-center">
          {{ page }} / {{ totalPages }}
        </span>
        <button
          type="button"
          class="w-7 h-7 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm text-slate-500 transition-all disabled:opacity-30"
          (click)="nextPage()"
          [disabled]="page >= totalPages">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Zoom & Modes -->
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-lg">
        <button
          type="button"
          class="px-2.5 py-1 text-[10px] font-bold rounded-md transition-all"
          [class.bg-white]="viewMode === 'scroll'"
          [class.shadow-sm]="viewMode === 'scroll'"
          [class.text-primary]="viewMode === 'scroll'"
          [class.text-slate-500]="viewMode !== 'scroll'"
          (click)="setViewMode('scroll')">
          Flux
        </button>
        <button
          type="button"
          class="px-2.5 py-1 text-[10px] font-bold rounded-md transition-all"
          [class.bg-white]="viewMode === 'page'"
          [class.shadow-sm]="viewMode === 'page'"
          [class.text-primary]="viewMode === 'page'"
          [class.text-slate-500]="viewMode !== 'page'"
          (click)="setViewMode('page')">
          Page
        </button>
      </div>

      <div class="h-4 w-px bg-slate-200"></div>

      <div class="flex items-center gap-2">
        <button
          type="button"
          class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500"
          (click)="zoomOut()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
          </svg>
        </button>
        <span class="text-[11px] font-bold text-slate-700 w-10 text-center">{{ (zoom * 100) | number:'1.0-0' }}%</span>
        <button
          type="button"
          class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500"
          (click)="zoomIn()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- PDF Viewport -->
  <div class="relative flex-1 bg-slate-200 overflow-hidden">
    <div *ngIf="!src" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-slate-50">
      <svg class="w-10 h-10 mb-2 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      <p class="text-[10px] font-bold uppercase tracking-widest">Aucun aperçu disponible</p>
    </div>

    <pdf-viewer 
      *ngIf="src"
      [src]="src"
      [render-text]="true"
      [original-size]="false"
      [show-all]="effectiveShowAll"
      [page]="page"
      [zoom]="zoom"
      style="display:block; height: 100%;"
      (page-rendered)="onPageRendered($event)"
      (pageChange)="onPageChange($event)"
      (after-load-complete)="onAfterLoadComplete($event)">
    </pdf-viewer>
  </div>
</div>
