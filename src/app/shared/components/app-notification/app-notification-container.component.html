<div class="fixed inset-x-0 top-24 z-[9999] flex items-start justify-center pointer-events-none">
  <div class="w-full max-w-sm space-y-3 pointer-events-auto">
    <div
      *ngFor="let notif of notifications$ | async; trackBy: trackById"
      class="rounded-2xl shadow-lg border px-5 py-4 bg-white flex flex-col gap-2"
      [ngClass]="{
        'border-emerald-200': notif.status === 'success',
        'border-red-200': notif.status === 'error',
        'border-blue-200': notif.status === 'info',
        'border-amber-200': notif.status === 'warning'
      }"
    >
      <div class="flex items-start gap-3">
        <!-- Icône + couleur -->
        <div
          class="h-8 w-8 rounded-full flex items-center justify-center text-white shrink-0"
          [ngClass]="{
            'bg-emerald-500': notif.status === 'success',
            'bg-red-500': notif.status === 'error',
            'bg-blue-500': notif.status === 'info',
            'bg-amber-500': notif.status === 'warning'
          }"
        >
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <ng-container [ngSwitch]="notif.status">
              <g *ngSwitchCase="'success'">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m5 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </g>
              <g *ngSwitchCase="'error'">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a1 1 0 00.86 1.5h18.64a1 1 0 00.86-1.5L13.71 3.86a1 1 0 00-1.72 0z" />
              </g>
              <g *ngSwitchCase="'warning'">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v4m0 4h.01M4.93 19h14.14L12 5 4.93 19z" />
              </g>
              <g *ngSwitchDefault>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13 16h-1v-4h-1m1-4h.01M12 3a9 9 0 110 18 9 9 0 010-18z" />
              </g>
            </ng-container>
          </svg>
        </div>

        <!-- Texte -->
        <div class="flex-1">
          <div *ngIf="notif.title" class="text-sm font-semibold text-slate-900 mb-0.5">
            {{ notif.title }}
          </div>
          <div class="text-xs text-slate-600">
            {{ notif.description }}
          </div>
        </div>

        <!-- Bouton fermer -->
        <button
          type="button"
          class="text-xs text-slate-400 hover:text-slate-600"
          (click)="dismiss(notif.id)"
        >
          ✕
        </button>
      </div>
    </div>
  </div>
</div>
