<div
  class="app-alert flex items-start gap-4 rounded-lg"
  [ngClass]="{
    'app-alert-success': type === 'success',
    'app-alert-danger': type === 'error',
    'app-alert-warning': type === 'warning',
    'app-alert-info': type === 'info'
  }"
>
  <!-- Icône -->
  <div class="mt-0.5 flex-shrink-0">
    <div class="h-8 w-8 rounded-lg bg-white/50 flex items-center justify-center shadow-sm">
      <svg *ngIf="type === 'success'" class="h-5 w-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
      </svg>
      <svg *ngIf="type === 'error'" class="h-5 w-5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <svg *ngIf="type === 'warning'" class="h-5 w-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <svg *ngIf="type === 'info'" class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M12 3a9 9 0 110 18 9 9 0 010-18z" />
      </svg>
    </div>
  </div>

  <!-- Texte -->
  <div class="flex-1 min-w-0">
    <div *ngIf="title" class="text-sm font-bold uppercase tracking-wider mb-1 opacity-90">
      {{ title }}
    </div>
    <div class="text-sm font-medium leading-relaxed opacity-80">
      {{ message }}
    </div>
  </div>

  <!-- Bouton fermer -->
  <button
    *ngIf="closable"
    type="button"
    class="p-1.5 rounded-md hover:bg-black/5 transition-colors focus:outline-none flex-shrink-0"
    (click)="onClose()"
    aria-label="Fermer"
  >
    <svg class="h-4 w-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
</div>
