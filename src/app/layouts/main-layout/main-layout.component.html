<div class="flex h-screen overflow-hidden bg-gray-100">
  <!-- Sidebar -->
  <app-sidebar [isOpen]="isSidebarOpen"></app-sidebar>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0 transition-all duration-300" [class.ml-[260px]]="isSidebarOpen" [class.ml-20]="!isSidebarOpen">
    <!-- Header -->
    <app-header [isSidebarOpen]="isSidebarOpen" (toggleSidebar)="toggleSidebar()"></app-header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
