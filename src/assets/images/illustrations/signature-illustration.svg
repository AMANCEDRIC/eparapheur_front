<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Document avec signature -->
  <rect x="100" y="50" width="300" height="250" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="120" y="80" width="260" height="8" rx="4" fill="#F3F4F6"/>
  <rect x="120" y="100" width="200" height="8" rx="4" fill="#F3F4F6"/>
  <rect x="120" y="120" width="180" height="8" rx="4" fill="#F3F4F6"/>
  
  <!-- Zone de signature -->
  <rect x="150" y="200" width="200" height="60" rx="4" fill="#F0F9FF" stroke="#0083c0" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M160 230 Q180 220, 200 230 T240 230" stroke="#0083c0" stroke-width="2" fill="none"/>
  <text x="250" y="250" font-family="Arial" font-size="12" fill="#6B7280">Signature électronique</text>
  
  <!-- Icône de validation -->
  <circle cx="320" cy="220" r="20" fill="#10B981"/>
  <path d="M310 220 L318 228 L330 210" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Flèches de processus -->
  <path d="M50 200 L100 200" stroke="#0083c0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M400 200 L450 200" stroke="#0083c0" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Étape 1 : Document -->
  <rect x="20" y="150" width="60" height="80" rx="4" fill="#E0F2FE" stroke="#0083c0" stroke-width="2"/>
  <rect x="30" y="165" width="40" height="5" rx="2" fill="#0083c0"/>
  <rect x="30" y="175" width="40" height="5" rx="2" fill="#0083c0"/>
  <rect x="30" y="185" width="30" height="5" rx="2" fill="#0083c0"/>
  <text x="50" y="250" font-family="Arial" font-size="10" fill="#6B7280" text-anchor="middle">Document</text>
  
  <!-- Étape 3 : Validation -->
  <rect x="420" y="150" width="60" height="80" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <circle cx="450" cy="190" r="15" fill="#10B981"/>
  <path d="M442 190 L448 196 L458 180" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="450" y="250" font-family="Arial" font-size="10" fill="#6B7280" text-anchor="middle">Validé</text>
  
  <!-- Définition de la flèche -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0083c0"/>
    </marker>
  </defs>
  
  <!-- Éléments décoratifs -->
  <circle cx="250" cy="350" r="30" fill="#0083c0" opacity="0.1"/>
  <circle cx="150" cy="320" r="20" fill="#0083c0" opacity="0.1"/>
  <circle cx="350" cy="320" r="20" fill="#0083c0" opacity="0.1"/>
</svg>

